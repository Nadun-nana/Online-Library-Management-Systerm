<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new book to the Online Library Management System.">
    <title>Add Book - Online Library Management System</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="navbar">
        <a href="dashborad.html" class="navbar-brand">Nebula Institute of Technology</a>
        <div class="navbar-actions">
            <a href="dashborad.html" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-card">
        <h2>Add New Book</h2>
        <span class="page-sub">Fill in the details below to add a book to the library.</span>

        <div class="alert-box" id="alert-box"></div>

        <form id="add-book-form" novalidate>

            <div class="form-group">
                <label for="book-title">Book Title</label>
                <input type="text" id="book-title" placeholder="Enter the book title" required>
            </div>

            <div class="form-group">
                <label for="book-author">Author</label>
                <input type="text" id="book-author" placeholder="Enter the author name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="book-year">Year Published</label>
                    <input type="number" id="book-year" placeholder="e.g. 2023" min="1000" max="2099">
                </div>
                <div class="form-group">
                    <label for="book-copies">Number of Copies</label>
                    <input type="number" id="book-copies" placeholder="e.g. 5" min="1" value="1">
                </div>
            </div>

            <div class="form-group">
                <label for="book-genre">Genre</label>
                <select id="book-genre">
                    <option value="">Select genre</option>
                    <option>Fiction</option>
                    <option>Non-Fiction</option>
                    <option>Science</option>
                    <option>History</option>
                    <option>Technology</option>
                    <option>Biography</option>
                    <option>Education</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="book-desc">Description (optional)</label>
                <textarea id="book-desc" placeholder="Brief description of the book..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn" id="btn-add-book">Add Book</button>
                <a href="dashborad.html" class="btn-back" id="btn-cancel">Cancel</a>
            </div>

        </form>
    </div>

    <script>
        // Protect page — must be logged in
        const session = JSON.parse(localStorage.getItem('library_session') || 'null');
        if (!session) {
            window.location.href = 'login.html';
        }

        const form = document.getElementById('add-book-form');
        const alertBox = document.getElementById('alert-box');

        function showAlert(type, message) {
            alertBox.className = 'alert-box alert-' + type;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const title = document.getElementById('book-title').value.trim();
            const author = document.getElementById('book-author').value.trim();
            const year = document.getElementById('book-year').value.trim();
            const copies = parseInt(document.getElementById('book-copies').value) || 1;
            const genre = document.getElementById('book-genre').value;
            const desc = document.getElementById('book-desc').value.trim();

            if (!title || !author) {
                showAlert('error', 'Book Title and Author are required.');
                return;
            }

            // Save to localStorage
            const books = JSON.parse(localStorage.getItem('library_books') || '[]');
            books.push({
                id: Date.now(),
                title,
                author,
                year,
                genre,
                copies,
                desc,
                available: copies,
                addedBy: session.username,
                addedAt: new Date().toISOString()
            });
            localStorage.setItem('library_books', JSON.stringify(books));

            showAlert('success', 'Book "' + title + '" added successfully! Redirecting...');
            form.reset();

            setTimeout(() => {
                window.location.href = 'dashborad.html';
            }, 1500);
        });
    </script>

</body>

</html>
