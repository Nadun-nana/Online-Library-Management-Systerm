<html>

<head>
    <title>Return Books - Online Library Management System</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        .penalty-highlight {
            font-weight: bold;
            color: #c5221f;
            background-color: #fce8e6 !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Return Book</h1>
        <form action="return_books.html" method="post">
            <div class="form-group">
                <label for="title">Book Title:</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>
            </div>

            <div class="form-group">
                <label for="return_date">Expected Return Date:</label>
                <input type="date" id="return_date" name="return_date" required>
            </div>

            <div class="form-group">
                <label for="actual_return_date">Actual Return Date:</label>
                <input type="date" id="actual_return_date" name="actual_return_date" required>
            </div>

            <div class="form-group">
                <label for="penalty">Penalty Fee (5 LKR per day):</label>
                <input type="text" id="penalty" name="penalty" readonly class="penalty-highlight" value="0 LKR">
            </div>

            <div class="form-actions">
                <input type="submit" value="Return Book" class="btn">
                <a href="dashborad.html" class="btn btn-secondary">Back</a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const returnDateInput = document.getElementById('return_date');
            const actualReturnDateInput = document.getElementById('actual_return_date');
            const penaltyInput = document.getElementById('penalty');

            // Format date as YYYY-MM-DD
            const formatDate = (date) => {
                const yyyy = date.getFullYear();
                const mm = String(date.getMonth() + 1).padStart(2, '0');
                const dd = String(date.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            };

            // Set return date (due date) to 14 days ago to demonstrate penalty
            const dueDate = new Date(today);
            dueDate.setDate(today.getDate() - 14);
            returnDateInput.value = formatDate(dueDate);

            // Set actual return date to today
            actualReturnDateInput.value = formatDate(today);

            // Calculate penalty function
            function calculatePenalty() {
                const returnDateVal = returnDateInput.value;
                const actualReturnDateVal = actualReturnDateInput.value;

                if (!returnDateVal || !actualReturnDateVal) {
                    penaltyInput.value = "0 LKR";
                    penaltyInput.classList.remove('penalty-highlight');
                    return;
                }

                const returnDate = new Date(returnDateVal);
                const actualReturnDate = new Date(actualReturnDateVal);

                // Set to midnight to calculate exact calendar day difference
                returnDate.setHours(0, 0, 0, 0);
                actualReturnDate.setHours(0, 0, 0, 0);

                const timeDiff = actualReturnDate.getTime() - returnDate.getTime();
                const dayDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));

                if (dayDiff > 0) {
                    const penalty = dayDiff * 5;
                    penaltyInput.value = `${penalty} LKR (${dayDiff} day${dayDiff === 1 ? '' : 's'} late)`;
                    penaltyInput.style.color = '#c5221f';
                    penaltyInput.style.backgroundColor = '#fce8e6';
                } else {
                    penaltyInput.value = "0 LKR";
                    penaltyInput.style.color = '#2e7d32';
                    penaltyInput.style.backgroundColor = '#e6f4ea';
                }
            }

            // Bind listeners
            returnDateInput.addEventListener('change', calculatePenalty);
            actualReturnDateInput.addEventListener('change', calculatePenalty);

            // Initial calculation
            calculatePenalty();
        });
    </script>
</body>

</html>
